<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Takip Karşılaştırma</h1>
  <button id="run">Açık profili karşılaştır</button>
  <details>
    <summary>Instagram veri indirmesinden içe aktar</summary>
    <p class="hint">Instagram → Hesap Merkezi → Bilgilerin ve izinlerin → Bilgilerini indir → Takipçiler ve takip edilenler, <b>JSON</b> biçimi. <code>followers_1.json</code> ve <code>following.json</code> dosyalarını birlikte seçin.</p>
    <input type="file" id="files" accept=".json" multiple>
  </details>
  <p id="status"></p>
  <div id="tabs" hidden>
    <button data-tab="notFollowingBack" class="active">Geri takip etmeyenler</button>
    <button data-tab="notFollowedBack">Takip etmediklerim</button>
    <button data-tab="mutual">Karşılıklı</button>
  </div>
  <ul id="list"></ul>
  <script src="popup.js"></script>
</body>
</html>
